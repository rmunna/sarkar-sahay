<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept B: Minimal nest with citizen silhouette -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E64A19;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="256" cy="230" r="175" fill="none" stroke="url(#blueGrad)" stroke-width="8"/>
  
  <!-- Nest bowl -->
  <path d="M130 280 Q160 230 256 240 Q352 230 382 280" fill="none" stroke="url(#orangeGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M148 310 Q180 265 256 273 Q332 265 364 310" fill="none" stroke="url(#orangeGrad)" stroke-width="11" stroke-linecap="round"/>
  <path d="M170 335 Q205 300 256 305 Q307 300 342 335" fill="none" stroke="url(#orangeGrad)" stroke-width="9" stroke-linecap="round"/>
  
  <!-- People silhouettes (family in nest) -->
  <!-- Person 1 (center, taller) -->
  <circle cx="256" cy="175" r="22" fill="url(#blueGrad)"/>
  <path d="M232 200 Q232 230 256 235 Q280 230 280 200" fill="url(#blueGrad)"/>
  
  <!-- Person 2 (left, shorter) -->
  <circle cx="210" cy="195" r="17" fill="url(#blueGrad)" opacity="0.7"/>
  <path d="M192 215 Q192 238 210 242 Q228 238 228 215" fill="url(#blueGrad)" opacity="0.7"/>
  
  <!-- Person 3 (right, shorter) -->
  <circle cx="302" cy="195" r="17" fill="url(#blueGrad)" opacity="0.7"/>
  <path d="M284 215 Q284 238 302 242 Q320 238 320 215" fill="url(#blueGrad)" opacity="0.7"/>
  
  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#1565C0">Citizen<tspan fill="#FF7043">Nest</tspan></text>
</svg>