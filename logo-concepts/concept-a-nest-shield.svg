<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept A: Nest + Shield — warm nest shape with document/shield element -->
  <defs>
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E85D26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D8F4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Nest base (bowl shape) -->
  <path d="M256 420 C140 420 80 360 80 300 C80 280 90 265 110 258 C100 240 100 220 120 200 C140 180 170 175 195 180 C180 160 190 140 215 130 C240 120 265 125 280 140 C300 125 330 120 355 135 C375 148 382 170 370 190 C400 185 425 200 435 225 C445 250 435 275 420 290 C430 310 430 340 400 370 C370 400 320 420 256 420Z" fill="url(#nestGrad)" opacity="0.15"/>
  
  <!-- Nest twigs (curved lines) -->
  <path d="M120 310 Q180 280 256 290 Q332 280 392 310" fill="none" stroke="url(#nestGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 340 Q190 310 256 318 Q322 310 372 340" fill="none" stroke="url(#nestGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M160 368 Q200 345 256 350 Q312 345 352 368" fill="none" stroke="url(#nestGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 392 Q215 378 256 382 Q297 378 327 392" fill="none" stroke="url(#nestGrad)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- House/roof inside nest -->
  <path d="M256 120 L340 195 L330 195 L330 270 L182 270 L182 195 L172 195 Z" fill="url(#nestGrad)"/>
  <!-- Door -->
  <rect x="235" y="220" width="42" height="50" rx="4" fill="white"/>
  <!-- Window left -->
  <rect x="195" y="200" width="28" height="28" rx="3" fill="white" opacity="0.9"/>
  <!-- Window right -->
  <rect x="289" y="200" width="28" height="28" rx="3" fill="white" opacity="0.9"/>
  
  <!-- Small leaf accent -->
  <path d="M340 155 Q365 130 380 145 Q365 165 340 155Z" fill="url(#leafGrad)"/>
  <path d="M345 158 Q365 140 375 150" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Text -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#2D3748">Citizen<tspan fill="#FF6B35">Nest</tspan></text>
</svg>