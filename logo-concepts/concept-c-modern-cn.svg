<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept C: Modern CN monogram with nest accent — works great as favicon -->
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6D00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1642;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square (favicon-friendly) -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="url(#navyGrad)"/>
  
  <!-- Saffron stripe top -->
  <rect x="20" y="20" width="472" height="8" rx="4" fill="#FF8F00"/>
  
  <!-- Green stripe bottom -->
  <rect x="20" y="484" width="472" height="8" rx="4" fill="#2E7D32"/>
  
  <!-- CN Letters -->
  <text x="256" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="220" fill="white" letter-spacing="-10">CN</text>
  
  <!-- Small nest accent under letters -->
  <path d="M160 340 Q200 320 256 325 Q312 320 352 340" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M180 358 Q212 342 256 346 Q300 342 332 358" fill="none" stroke="url(#saffronGrad)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Tagline -->
  <text x="256" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="white" opacity="0.7" letter-spacing="8">CITIZENNEST</text>
</svg>