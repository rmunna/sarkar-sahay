name: Exam Monitor — Detect & Publish Updates

on:
  # Scheduled polling moved to Cloudflare Worker:
  # https://citizennest-detection.citizennest.workers.dev
  # Keep manual dispatch as a fallback for sources that block Cloudflare.
  workflow_dispatch:
    inputs:
      tier:
        description: 'Max source tier to scan (1=top only, 2=all)'
        required: false
        default: '2'
      force_scan:
        description: 'Force scan all sources (ignore change detection)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write   # allow triggering the Deploy workflow via gh workflow run

jobs:
  monitor-and-generate:
    name: Poll Exam Sites & Generate with Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24 before June 2 forced cutover

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # ── Step 0: Write Google service account key (always, for all runs) ──
      - name: Write Google service account key
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          mkdir -p keys
          echo "$GOOGLE_INDEXING_KEY" > keys/gsc-service-account.json
          BYTES=$(wc -c < keys/gsc-service-account.json)
          echo "✅ Key file written ($BYTES bytes)"
          node -e "
            const d = JSON.parse(require('fs').readFileSync('./keys/gsc-service-account.json','utf8'));
            console.log('  type:', d.type);
            console.log('  project_id:', d.project_id);
          " 2>/dev/null || echo "  ⚠️ Key is not valid JSON — may need base64 decode"

      # ── Step 1: Poll exam sites for changes ──────────────────────────────

      - name: Poll exam sites (zero API cost)
        id: monitor
        run: |
          # || true: some govt sites return malformed HTTP headers (e.g. kpsc.kar.nic.in)
          # causing Node socket-level uncaughtException → exit 1. The JSON output is still
          # written before the crash, so we tolerate the non-zero exit and read the file.
          node agents/exam-site-monitor.js || true

          REAL_CHANGES=$(node -e "
            try {
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('./agents/exam-monitor-latest.json','utf8'));
              const real = d.changes.filter(c => c.type !== 'CONTENT_CHANGE');
              console.log(real.length);
            } catch(e) { console.log(0); }
          ")
          NOISE_CHANGES=$(node -e "
            try {
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('./agents/exam-monitor-latest.json','utf8'));
              console.log(d.noiseDetected || 0);
            } catch(e) { console.log(0); }
          ")
          echo "change_count=$REAL_CHANGES" >> $GITHUB_OUTPUT
          echo "noise_count=$NOISE_CHANGES" >> $GITHUB_OUTPUT
          echo "has_changes=$([ $REAL_CHANGES -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Real changes: $REAL_CHANGES"
          echo "Noise changes: $NOISE_CHANGES"

      # ── Step 2: Generate content with Gemini (free API) ──────────────────

      - name: Generate update pages with Gemini
        if: steps.monitor.outputs.has_changes == 'true' || github.event.inputs.force_scan == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.tier }}" != "" ] && ARGS="$ARGS --tier ${{ github.event.inputs.tier }}"
          [ "${{ github.event.inputs.force_scan }}" = "true" ] && ARGS="$ARGS --force-scan"
          node scripts/generate-updates-gemini.js $ARGS

      # ── Step 3: Commit new content if any ────────────────────────────────

      - name: Commit and push new updates
        id: commit
        run: |
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          # Stage generated content and tracker state together. If no content
          # was generated, nothing is pushed to git.
          git add -A content/updates agents/exam-monitor-tracker.json agents/exam-monitor-latest.json agents/source-monitors.json || true
          # Check for staged changes under content/updates specifically
          if git diff --staged --name-only -- 'content/updates/*' | grep -q .; then
            NEW=$(git diff --staged --name-only -- 'content/updates/*' | wc -l | tr -d ' ')
            git commit -m "content: auto-add ${NEW} exam update(s) [$(date +'%Y-%m-%d %H:%M IST')]

            Source: GitHub Actions exam-monitor workflow
            Tier: ${{ github.event.inputs.tier || '2' }} [skip vercel]"
            # Stash unstaged tracker files before rebase (they block git pull --rebase)
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push
            echo "new_count=$NEW" >> $GITHUB_OUTPUT
            echo "✅ Pushed $NEW new update(s)"
          else
            git restore --staged agents/exam-monitor-tracker.json agents/exam-monitor-latest.json agents/source-monitors.json || true
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "No new content — nothing to commit"
          fi

      # ── Step 4: Regenerate sitemap ───────────────────────────────────────

      - name: Regenerate sitemap
        if: steps.commit.outputs.new_count > 0
        run: |
          npx tsx scripts/generate-sitemap.ts
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          git add public/sitemap.xml public/sitemap-index.xml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate sitemap after new updates [skip ci] [skip vercel]"
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push || true
          fi

      # ── Step 5: Submit new URLs to search engines ────────────────────────

      # Publish: trigger the Deploy workflow (a GITHUB_TOKEN push can't auto-
      # trigger it). Deploy builds → goes live → THEN submits the new pages to
      # Google Indexing (scripts/index-recent-content.mjs) so Google never
      # fetches a 404. Replaces the old pre-deploy submit that hit 404s.
      - name: Trigger deploy + Google indexing
        if: steps.commit.outputs.new_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy to Cloudflare" \
            && echo "✅ Deploy triggered — publishes the new pages and submits to Google once live" \
            || echo "⚠️ deploy trigger failed (non-critical)"

      - name: Submit to IndexNow (Bing + Yandex)
        if: steps.commit.outputs.new_count > 0
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            URLS_JSON=$(while IFS= read -r slug; do
              [ -z "$slug" ] && continue
              printf '"https://www.citizennest.com/update/%s",' "$slug"
            done < agents/.newly-generated-slugs | sed 's/,$//')
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"www.citizennest.com\",\"key\":\"c4afa3fbd1f57a882b7e8453af3e4f7e\",\"keyLocation\":\"https://www.citizennest.com/c4afa3fbd1f57a882b7e8453af3e4f7e.txt\",\"urlList\":[$URLS_JSON]}" \
              && echo "✅ IndexNow submitted" || echo "⚠️ IndexNow failed (non-critical)"
          else
            echo "No slug file — skipping IndexNow"
          fi

      # ── Step 6: Notify channels ──────────────────────────────────────────

      - name: Post to Telegram channel
        if: steps.commit.outputs.new_count > 0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-telegram.js agents/.newly-generated-slugs || true
          fi

      - name: Post to WhatsApp channel
        if: steps.commit.outputs.new_count > 0
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-whatsapp.js agents/.newly-generated-slugs || true
          fi

      - name: Post to Facebook Page
        if: steps.commit.outputs.new_count > 0
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-facebook.js agents/.newly-generated-slugs || true
          fi

      - name: Post to LinkedIn Company Page
        if: steps.commit.outputs.new_count > 0
        env:
          LI_ORGANIZATION_ID: ${{ secrets.LI_ORGANIZATION_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-linkedin.js agents/.newly-generated-slugs || true
          fi

      - name: Post to Reddit (subreddit auto-match)
        if: steps.commit.outputs.new_count > 0
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-reddit.js agents/.newly-generated-slugs || true
            rm -f agents/.newly-generated-slugs
          fi

      # ── Summary ──────────────────────────────────────────────────────────

      - name: Job Summary
        if: always()
        run: |
          echo "## 📊 Exam Monitor Run" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Real changes detected | ${{ steps.monitor.outputs.change_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Noise changes detected | ${{ steps.monitor.outputs.noise_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New pages generated | ${{ steps.commit.outputs.new_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run time (UTC) | $(date -u) |" >> $GITHUB_STEP_SUMMARY
