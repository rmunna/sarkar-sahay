name: Spike Detector — Google Trends → Auto-Generate Pages

on:
  schedule:
    # Google Trends RSS (national + state feeds) — no auth, not rate-limited
    # like pytrends. Spikes are time-sensitive, so poll every 2 hours.
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (detect but do not write files)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  detect-and-generate:
    name: Detect Trending Spikes & Generate Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      # ── Step 1: Query Google Trends RSS for rising exam/job queries ──────
      # pytrends is dead (Google 429s related_queries, removed trending_searches)
      # so the scanner runs RSS-only on the runner's system python3.

      - name: Scan rising trends (Google Trends RSS, national + state feeds)
        id: trends
        env:
          SKIP_PYTRENDS: '1'
        run: |
          python3 agents/trending-pytrends.py

          SPIKE_COUNT=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('./agents/trending-pytrends.json','utf8'));
              console.log((d.spike_candidates || []).length);
            } catch(e) { console.log(0); }
          ")
          SCHEME_OPPORTUNITY_COUNT=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('./agents/trending-pytrends.json','utf8'));
              console.log((d.scheme_opportunities || []).length);
            } catch(e) { console.log(0); }
          ")
          echo "spike_count=$SPIKE_COUNT" >> $GITHUB_OUTPUT
          echo "scheme_opportunity_count=$SCHEME_OPPORTUNITY_COUNT" >> $GITHUB_OUTPUT
          echo "has_spikes=$([ $SPIKE_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Spike candidates: $SPIKE_COUNT"
          echo "Scheme opportunities: $SCHEME_OPPORTUNITY_COUNT"

      # ── Step 2: Generate pages for spike candidates ──────────────────────

      - name: Generate spike pages with Gemini
        if: steps.trends.outputs.has_spikes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          node scripts/generate-spike-pages.js $ARGS

      # ── Step 3: Commit new pages ─────────────────────────────────────────

      - name: Commit and push spike pages
        id: commit
        run: |
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          git add content/updates/ agents/trending-pytrends.json || true
          NEW=$(git diff --staged --name-only | grep 'content/updates/' | wc -l | tr -d ' ')
          if [ "$NEW" -gt 0 ]; then
            git commit -m "content: auto-add ${NEW} spike page(s) from Google Trends [$(date +'%Y-%m-%d')]

            Source: trending-pytrends.py (RSS realtime + Jobs/Education/Govt categories)
            Spike threshold: 200%+ rising"
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push
            echo "new_count=$NEW" >> $GITHUB_OUTPUT
            echo "✅ Pushed $NEW spike page(s)"
          else
            git restore --staged agents/trending-pytrends.json || true
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "No new spike pages — nothing to commit"
          fi

      # ── Step 4: Regenerate sitemap ───────────────────────────────────────

      - name: Regenerate sitemap
        if: steps.commit.outputs.new_count > 0
        run: |
          npx tsx scripts/generate-sitemap.ts
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          git add public/sitemap.xml public/sitemap-index.xml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate sitemap after spike pages [skip ci]"
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push || true
          fi

      # ── Step 5: Submit to indexing APIs ──────────────────────────────────

      - name: Write Google service account key
        if: steps.commit.outputs.new_count > 0
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          mkdir -p keys
          echo "$GOOGLE_INDEXING_KEY" > keys/gsc-service-account.json
          echo "✅ Key file written ($(wc -c < keys/gsc-service-account.json) bytes)"

      - name: Submit to Google Indexing API
        if: steps.commit.outputs.new_count > 0
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            echo "Submitting slugs:"
            cat agents/.newly-generated-slugs
            while IFS= read -r slug; do
              node scripts/google-index-submit.js "https://www.citizennest.com/update/$slug" || true
            done < agents/.newly-generated-slugs
          else
            echo "No .newly-generated-slugs file found — skipping"
          fi

      - name: Submit to IndexNow (Bing + Yandex)
        if: steps.commit.outputs.new_count > 0
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            URLS_JSON=$(while IFS= read -r slug; do
              [ -z "$slug" ] && continue
              printf '"https://www.citizennest.com/update/%s",' "$slug"
            done < agents/.newly-generated-slugs | sed 's/,$//')
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"www.citizennest.com\",\"key\":\"c4afa3fbd1f57a882b7e8453af3e4f7e\",\"keyLocation\":\"https://www.citizennest.com/c4afa3fbd1f57a882b7e8453af3e4f7e.txt\",\"urlList\":[$URLS_JSON]}" \
              && echo "✅ IndexNow submitted" || echo "⚠️ IndexNow failed (non-critical)"
          else
            echo "No slug file — skipping IndexNow"
          fi

      # ── Step 6: Notify channels ──────────────────────────────────────────

      - name: Post to Telegram channel
        if: steps.commit.outputs.new_count > 0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-telegram.js agents/.newly-generated-slugs || true
          fi

      - name: Post to WhatsApp channel
        if: steps.commit.outputs.new_count > 0
        env:
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_CHANNEL_ID: ${{ secrets.WA_CHANNEL_ID }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-whatsapp.js agents/.newly-generated-slugs || true
          fi

      - name: Post to Facebook Page
        if: steps.commit.outputs.new_count > 0
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-facebook.js agents/.newly-generated-slugs || true
          fi

      - name: Post to LinkedIn Company Page
        if: steps.commit.outputs.new_count > 0
        env:
          LI_ORGANIZATION_ID: ${{ secrets.LI_ORGANIZATION_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-linkedin.js agents/.newly-generated-slugs || true
          fi

      - name: Post to Reddit (subreddit auto-match)
        if: steps.commit.outputs.new_count > 0
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          if [ -f "agents/.newly-generated-slugs" ]; then
            node scripts/notify-reddit.js agents/.newly-generated-slugs || true
            rm -f agents/.newly-generated-slugs
          fi

      # ── Summary ──────────────────────────────────────────────────────────

      - name: Job Summary
        if: always()
        run: |
          echo "## 🔥 Spike Detector Run" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Spike candidates detected | ${{ steps.trends.outputs.spike_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scheme opportunities detected | ${{ steps.trends.outputs.scheme_opportunity_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New spike pages generated | ${{ steps.commit.outputs.new_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run time (UTC) | $(date -u) |" >> $GITHUB_STEP_SUMMARY
