name: Fill Missing Scheme Detail — Task #10

# Fills _detail/*.json for the ~102 schemes that have no detail file.
# Runs daily until all are filled; self-terminates when nothing remains.
# Safe: only creates NEW files, never overwrites existing detail.

on:
  schedule:
    - cron: '0 4 * * *'   # 9:30 AM IST daily
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Schemes to enrich per run (default 40)'
        required: false
        default: '40'

permissions:
  contents: write

jobs:
  fill-detail:
    name: Enrich missing scheme detail pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Count schemes needing enrichment
        id: count
        run: |
          MISSING=$(node -e "
            const fs = require('fs');
            const schemes = JSON.parse(fs.readFileSync('data/schemes/myscheme.json','utf-8'));
            const readSlugs = d => fs.existsSync(d) ? new Set(fs.readdirSync(d).filter(f=>f.endsWith('.json')).map(f=>f.slice(0,-5))) : new Set();
            const det = readSlugs('data/schemes/_detail');
            const rw  = readSlugs('data/schemes/_detail_rw');
            const n = schemes.filter(s => s.msSlug && !det.has(s.msSlug) && !rw.has(s.msSlug)).length;
            console.log(n);
          ")
          echo "missing=$MISSING" >> $GITHUB_OUTPUT
          echo "Schemes needing detail: $MISSING"
          [ "$MISSING" -eq 0 ] && echo "has_work=false" >> $GITHUB_OUTPUT || echo "has_work=true" >> $GITHUB_OUTPUT

      - name: Generate missing detail files
        if: steps.count.outputs.has_work == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BATCH="${{ github.event.inputs.batch_size || '40' }}"
          node scripts/fill-missing-scheme-detail.mjs --batch=$BATCH

      - name: Commit new detail files
        id: commit
        if: steps.count.outputs.has_work == 'true'
        run: |
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          git add data/schemes/_detail/
          NEW=$(git diff --staged --name-only | wc -l | tr -d ' ')
          if [ "$NEW" -gt 0 ]; then
            git commit -m "feat(#10): enrich ${NEW} scheme detail page(s) [$(date +'%Y-%m-%d')]

Task #10 batch — fill missing _detail/*.json for scheme pages.
${NEW} schemes now have rich content (benefits, eligibility, how-to-apply).
Pages will switch from noindex to indexable on next deploy."
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push
            echo "new_count=$NEW" >> $GITHUB_OUTPUT
            echo "✅ Pushed $NEW new detail files"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "No new files written"
          fi

      - name: Trigger deploy (only when files were actually committed)
        if: steps.commit.outputs.new_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy to Cloudflare" && echo "✅ Deploy triggered" || echo "⚠️ deploy trigger failed (non-critical)"

      - name: Summary
        if: always()
        run: |
          REMAINING=$(node -e "
            const fs = require('fs');
            try {
              const schemes = JSON.parse(fs.readFileSync('data/schemes/myscheme.json','utf-8'));
              const det = new Set(fs.readdirSync('data/schemes/_detail').map(f=>f.slice(0,-5)));
              const rw = new Set(fs.readdirSync('data/schemes/_detail_rw').map(f=>f.slice(0,-5)));
              console.log(schemes.filter(s=>s.msSlug && !det.has(s.msSlug) && !rw.has(s.msSlug)).length);
            } catch(e) { console.log('?'); }
          " 2>/dev/null || echo '?')
          echo "## Task #10 — Scheme Detail Fill" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Schemes still missing detail | $REMAINING |" >> $GITHUB_STEP_SUMMARY
          echo "| Run date | $(date -u +'%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY
          [ "$REMAINING" = "0" ] && echo "✅ Task #10 complete — all schemes have detail" >> $GITHUB_STEP_SUMMARY || true
