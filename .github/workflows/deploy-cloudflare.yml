name: Deploy to Cloudflare

# Replaces Vercel's git-push auto-deploy. The content monitors commit generated
# pages to main; this builds the OpenNext bundle and deploys it to the
# `citizennest` Worker so new content actually reaches the live site.
#
# Required repo secret:  CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers"
#   + D1 Edit on account e8f8278ada329401d5acdf53d3404339)
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_AD_SLOT_DATA, NEXT_PUBLIC_AD_SLOT_STICKY  (AdSense slot IDs)

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/**"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "package.json"
  workflow_dispatch:

# A newer commit supersedes an in-flight deploy; never run two deploys at once.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy OpenNext → Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e8f8278ada329401d5acdf53d3404339
      NEXT_PUBLIC_SITE_URL: https://www.citizennest.com
      GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
      NEXT_PUBLIC_AD_SLOT_DATA: ${{ vars.NEXT_PUBLIC_AD_SLOT_DATA }}
      NEXT_PUBLIC_AD_SLOT_STICKY: ${{ vars.NEXT_PUBLIC_AD_SLOT_STICKY }}
      # Affiliate links — set these as repo Variables once you have accounts.
      NEXT_PUBLIC_AFF_TESTSERIES_URL: ${{ vars.NEXT_PUBLIC_AFF_TESTSERIES_URL }}
      NEXT_PUBLIC_AFF_DEMAT_URL: ${{ vars.NEXT_PUBLIC_AFF_DEMAT_URL }}
      NEXT_PUBLIC_AFF_LOAN_URL: ${{ vars.NEXT_PUBLIC_AFF_LOAN_URL }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Guard — API token present
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::CLOUDFLARE_API_TOKEN secret not set — add it in repo Settings → Secrets"; exit 1; }
          echo "token present"

      - name: Build (OpenNext)
        run: npm run cf:build

      - name: Deploy to Cloudflare
        run: npm run cf:deploy

      # Pages are now LIVE — submit recently-published updates to Google Indexing.
      # Runs here (not on push) because monitor commits via GITHUB_TOKEN can't
      # trigger the push-based Auto-Index workflow.
      - name: Index newly-published content (Google)
        if: success()
        run: node scripts/index-recent-content.mjs || echo "indexing step soft-failed"

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Cloudflare deploy" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
