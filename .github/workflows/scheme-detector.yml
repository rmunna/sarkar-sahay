name: Scheme Detector — PIB RSS → Auto-Generate Guides

# Runs daily at 9:00 AM IST (3:30 UTC) — catches morning government announcements
# Also triggered manually for on-demand runs.
#
# Pipeline:
#   PIB RSS (ministry-specific) → pib-scanner.js → generate-scheme-guide.js → content/guides/
#
# NOTE: No Telegram notification — Telegram channel @citizennest is for Jobs & Exams only.
# Scheme guides are indexed and published silently.

on:
  repository_dispatch:
    types: [cloudflare_scheme_batch]
  # Scheduled scheme polling is moving to Cloudflare official-feed detection.
  # Keep manual dispatch as a fallback while the Cloudflare handoff is expanded.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (detect schemes but do not write files)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  detect-and-generate:
    name: Detect New Schemes & Generate Guides
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      # ── Step 0: Write Google service account key (always) ───────────────────
      - name: Write Google service account key
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          mkdir -p keys
          echo "$GOOGLE_INDEXING_KEY" > keys/gsc-service-account.json
          BYTES=$(wc -c < keys/gsc-service-account.json)
          echo "✅ Key file written ($BYTES bytes)"
          node -e "
            const d = JSON.parse(require('fs').readFileSync('./keys/gsc-service-account.json','utf8'));
            console.log('  type:', d.type, '| project_id:', d.project_id);
          " 2>/dev/null || echo "  ⚠️ Key not valid JSON"

      # ── Step 1: Scan PIB + RBI RSS for new scheme announcements ─────────────

      - name: Scan PIB RSS feeds
        id: pib_scan
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            node scripts/scheme-dispatch-extract.mjs
          else
            node agents/pib-scanner.js
          fi

          # Count scheme-type items (NEW_SCHEME_OR_LAUNCH + POLICY_CHANGE)
          SCHEME_COUNT=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('./agents/pib-latest.json','utf8'));
              const items = (d.items || []).filter(i =>
                i.category === 'NEW_SCHEME_OR_LAUNCH' || i.category === 'POLICY_CHANGE'
              );
              console.log(items.length);
            } catch(e) { console.log(0); }
          ")
          echo "scheme_count=$SCHEME_COUNT" >> $GITHUB_OUTPUT
          echo "has_schemes=$([ $SCHEME_COUNT -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Scheme announcements found: $SCHEME_COUNT"

      # ── Step 2: Generate guides for new schemes ──────────────────────────────
      # Uses Gemini — ACCURACY ENFORCED:
      #   - Fetches actual PIB press release text as ground truth
      #   - Forbids fabricating dates, amounts, or eligibility criteria
      #   - Only .gov.in / .nic.in official links allowed

      - name: Generate scheme guides with Gemini
        if: steps.pib_scan.outputs.has_schemes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          node scripts/generate-scheme-guide.js $ARGS

      - name: Audit generated scheme guides
        if: steps.pib_scan.outputs.has_schemes == 'true'
        run: node scripts/audit-generated-content.mjs --dir=content/guides --dir=content/guides-ta --dir=content/guides-ml --dir=content/guides-te --revert-rejected --check-links

      # ── Step 3: Commit new guides ────────────────────────────────────────────

      - name: Commit and push scheme guides
        id: commit
        run: |
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          # Stage English AND all southern-language content directories
          git add content/guides/ content/guides-ta/ content/guides-ml/ content/guides-te/ \
            agents/pib-latest.json agents/pib-tracker.json 2>/dev/null || true
          NEW=$(git diff --staged --name-only | grep -E 'content/guides(-ta|-ml|-te)?/' | wc -l | tr -d ' ')
          if [ "$NEW" -gt 0 ]; then
            git commit -m "content: add ${NEW} new scheme guide(s) from PIB [$(date +'%Y-%m-%d')]

            Source: PIB RSS (ministry-specific feeds)
            Accuracy: verified from press release text + official .gov.in links
            Language: southern state schemes written in local language (ta/ml/te)
            Telegram: NOT posted (Jobs & Exams channel only)"
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push
            echo "new_count=$NEW" >> $GITHUB_OUTPUT
            echo "✅ Pushed $NEW new scheme guide(s)"
          else
            echo "new_count=0" >> $GITHUB_OUTPUT
            echo "No new scheme guides"
            # Don't push tracker if no changes detected — prevents unnecessary Vercel builds
            git restore --staged content/guides/ content/guides-ta/ content/guides-ml/ content/guides-te/ 2>/dev/null || true
            echo "✅ Skipped tracker push (no schemes found)"
          fi

      # ── Step 4: Regenerate sitemap ───────────────────────────────────────────

      - name: Regenerate sitemap
        if: steps.commit.outputs.new_count > 0
        run: |
          npx tsx scripts/generate-sitemap.ts
          git config user.name "CitizenNest Bot"
          git config user.email "bot@citizennest.com"
          git add public/sitemap.xml public/sitemap-index.xml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate sitemap after new scheme guides [skip ci]"
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git rebase origin/main 2>/dev/null || git rebase --abort
            git stash pop 2>/dev/null || true
            git push || true
          fi

      # ── Step 5: Submit to indexing APIs ─────────────────────────────────────
      # Fast indexing = scheme guide ranks before any competitor covers it

      - name: Submit new guides to Google Indexing API
        if: steps.commit.outputs.new_count > 0
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          if [ -f "agents/.newly-generated-scheme-slugs" ]; then
            echo "Submitting slugs (format: langCode:slug):"
            cat agents/.newly-generated-scheme-slugs
            # Parse "langCode:slug" → correct URL prefix
            # ta → /ta/guide, ml → /ml/guide, te → /te/guide, en (or any) → /guide
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              langCode="${entry%%:*}"
              slug="${entry##*:}"
              case "$langCode" in
                ta) urlPath="/ta/guide" ;;
                ml) urlPath="/ml/guide" ;;
                te) urlPath="/te/guide" ;;
                *)  urlPath="/guide" ;;
              esac
              node scripts/google-index-submit.js "https://www.citizennest.com${urlPath}/${slug}" || true
            done < agents/.newly-generated-scheme-slugs
          else
            echo "No .newly-generated-scheme-slugs file — skipping"
          fi

      - name: Submit to IndexNow (Bing + Yandex)
        if: steps.commit.outputs.new_count > 0
        run: |
          if [ -f "agents/.newly-generated-scheme-slugs" ]; then
            # Parse "langCode:slug" → correct URL prefix for each entry
            URLS_JSON=$(while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              langCode="${entry%%:*}"
              slug="${entry##*:}"
              case "$langCode" in
                ta) urlPath="/ta/guide" ;;
                ml) urlPath="/ml/guide" ;;
                te) urlPath="/te/guide" ;;
                *)  urlPath="/guide" ;;
              esac
              printf '"https://www.citizennest.com%s/%s",' "$urlPath" "$slug"
            done < agents/.newly-generated-scheme-slugs | sed 's/,$//')
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"www.citizennest.com\",\"key\":\"c4afa3fbd1f57a882b7e8453af3e4f7e\",\"keyLocation\":\"https://www.citizennest.com/c4afa3fbd1f57a882b7e8453af3e4f7e.txt\",\"urlList\":[$URLS_JSON]}" \
              && echo "✅ IndexNow submitted" || echo "⚠️ IndexNow failed (non-critical)"
            rm -f agents/.newly-generated-scheme-slugs
          else
            echo "No slug file — skipping IndexNow"
          fi

      # ── NO Telegram/WhatsApp — scheme content not posted to @citizennest ────
      # Telegram/WhatsApp channel is for Jobs & Exam updates only.
      # Facebook & LinkedIn are appropriate for scheme guides (broader audience).

      - name: Post to Facebook Page
        if: steps.commit.outputs.new_count > 0
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-scheme-slugs" ]; then
            node scripts/notify-facebook.js agents/.newly-generated-scheme-slugs || true
          fi

      - name: Post to LinkedIn Company Page
        if: steps.commit.outputs.new_count > 0
        env:
          LI_ORGANIZATION_ID: ${{ secrets.LI_ORGANIZATION_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
        run: |
          if [ -f "agents/.newly-generated-scheme-slugs" ]; then
            node scripts/notify-linkedin.js agents/.newly-generated-scheme-slugs || true
          fi

      - name: Post to Reddit (state subreddit auto-match)
        if: steps.commit.outputs.new_count > 0
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          if [ -f "agents/.newly-generated-scheme-slugs" ]; then
            node scripts/notify-reddit.js agents/.newly-generated-scheme-slugs || true
            rm -f agents/.newly-generated-scheme-slugs
          fi

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: Job Summary
        if: always()
        run: |
          echo "## 🏛 Scheme Detector Run" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| PIB scheme announcements found | ${{ steps.pib_scan.outputs.scheme_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| New scheme guides generated | ${{ steps.commit.outputs.new_count || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Telegram notification | ❌ Not sent (Jobs & Exams only) |" >> $GITHUB_STEP_SUMMARY
          echo "| Run time (UTC) | $(date -u) |" >> $GITHUB_STEP_SUMMARY

      - name: Mark Cloudflare scheme detections processed
        if: always() && github.event_name == 'repository_dispatch'
        env:
          CF_MONITOR_ADMIN_TOKEN: ${{ secrets.CF_MONITOR_ADMIN_TOKEN }}
          MONITOR_URL: https://citizennest-detection.citizennest.workers.dev
        run: |
          [ -z "$CF_MONITOR_ADMIN_TOKEN" ] && { echo "CF_MONITOR_ADMIN_TOKEN not set; skipping monitor status update"; exit 0; }
          export STATUS=$([ "${{ steps.commit.outputs.new_count || 0 }}" -gt 0 ] && echo "generated" || echo "generation_skipped")
          node <<'JS'
          const fs = require('fs');
          const https = require('https');
          const fingerprints = fs.existsSync('agents/.cloudflare-detection-fingerprints')
            ? fs.readFileSync('agents/.cloudflare-detection-fingerprints', 'utf8').split('\n').filter(Boolean)
            : [];
          if (fingerprints.length === 0) process.exit(0);
          const body = JSON.stringify({
            fingerprints,
            status: process.env.STATUS,
            runUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          });
          const req = https.request(`${process.env.MONITOR_URL}/detections/mark`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${process.env.CF_MONITOR_ADMIN_TOKEN}`,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body)
            }
          }, res => {
            res.resume();
            res.on('end', () => console.log(`Monitor status update: HTTP ${res.statusCode}`));
          });
          req.on('error', err => console.log(`Monitor status update failed: ${err.message}`));
          req.end(body);
          JS
